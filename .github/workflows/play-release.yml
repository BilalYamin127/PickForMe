name: Signed Play App Bundle
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique Play version code (increase for every upload)'
        required: true
        default: '1'
      build_name:
        description: 'User-facing version name'
        required: true
        default: '1.0.0'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Decode private upload key
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.PICKFORME_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY_BASE64" || { echo 'Upload-key secret is missing'; exit 1; }
          umask 077
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/pickforme-upload.jks"
      - name: Build signed bundle
        env:
          PICKFORME_KEYSTORE_PATH: ${{ runner.temp }}/pickforme-upload.jks
          PICKFORME_STORE_PASSWORD: ${{ secrets.PICKFORME_UPLOAD_STORE_PASSWORD }}
          PICKFORME_KEY_ALIAS: ${{ secrets.PICKFORME_UPLOAD_KEY_ALIAS }}
          PICKFORME_KEY_PASSWORD: ${{ secrets.PICKFORME_UPLOAD_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Build number must be a positive integer'; exit 1; }
          flutter build appbundle --release --build-number "$BUILD_NUMBER" --build-name "$BUILD_NAME"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pickforme-play-aab-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/pickforme-upload.jks"
